<!DOCTYPE html>
<html lang="en-US"> <!-- put your language here -->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>


  <!-- meta tags -->

  <!-- Google / Search Engine Tags -->
  <meta itemprop="name" content="Title">
  <meta itemprop="description" content="description">
  <meta itemprop="image" content="Google icon link">

  <!-- Facebook Meta Tags -->
  <meta property="og:url" content="url">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Title">
  <meta property="og:description" content="description">
  <meta property="og:image" content="Facebook display image link">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Title">
  <meta name="twitter:description" content="description">
  <meta name="twitter:image" content="Twitter display image link">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="stylesheet link">

  <!-- Favicon -->
  <link rel="icon" href="logo link" type="image/gif">
</head>

<body>
  <!-- body content -->
</body>

</html>
